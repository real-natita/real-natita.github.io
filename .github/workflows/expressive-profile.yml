name: Expressive Profile

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    paths:
      - profile.json
      - .profile/icons.json
      - .github/workflows/expressive-profile.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get renderer
        uses: actions/checkout@v4
        with:
          repository: metawka/expressive-profile
          ref: v1
          path: .expressive-profile

      - name: Render
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .expressive-profile/action/render.mjs

      - name: Drop credit block
        run: |
          sed -i '/metawka\.github\.io\/expressive-profile/d' README.md
          rm -f assets/credit-*.svg

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets README.md .profile
          git diff --cached --quiet || (git commit -m "Updated profile" && git push)
